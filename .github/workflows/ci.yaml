name: CI/CD Pipeline

# Controls when the workflow runs
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Defines the jobs that will run
jobs:
  # Job 1: Verification (Linting, Building, and Testing)
  verify:
    name: Lint, Build, & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        # Action to set up the Node.js environment and cache dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🔎 Run ESLint (Linting)
        run: npm run lint

      - name: 🛠️ Build TypeScript
        run: npm run build

      # - name: 🧪 Run Jest Tests
      #   run: npm run test:ci

