name: CI/CD Pipeline

# Controls when the workflow runs
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Defines the jobs that will run
jobs:
  # Job 1: Verification (Linting, Building, and Testing)
  verify:
    name: Lint, Build, & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Set environment variables for this job
    env:
      # 1. Set the Node environment to 'test'
      NODE_ENV: test

      # 2. Map GitHub Secrets to the env variables used by the application
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}  
      HTTP_SMS_API_URL: ${{ secrets.HTTP_SMS_API_URL }}
      HTTP_SMS_API_KEY: ${{ secrets.HTTP_SMS_API_KEY }}
      HTTP_SMS_FROM_NUMBER: ${{ secrets.HTTP_SMS_FROM_NUMBER }}
      JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
      BCRYPT_SALT_ROUNDS: ${{ secrets.BCRYPT_SALT_ROUNDS }}

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 🔎 Run ESLint (Linting)
        run: npm run lint

      - name: 🛠️ Build TypeScript
        run: npm run build

      - name: 🧪 Run Jest Tests
        run: npm run test

  # Job 2: Run Database Migrations - Runs ONLY on push to main/master
  migrate_database:
    name: Apply Database Migrations
    runs-on: ubuntu-latest
    needs: verify # Run only after verification passes
    if: github.event_name == 'push'
    timeout-minutes: 5

    # Environment variables needed for Drizzle Kit
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }} # Load DB connection string from GitHub Secrets

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: 📥 Install Dependencies
        run: npm ci

      - name: 📜 Apply Drizzle Migrations
        run: npx drizzle-kit migrate

